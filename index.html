<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body><svg xmlns="http://www.w3.org/2000/svg" width="840" height="1880" viewBox="0 0 840 1880" role="img" aria-labelledby="title description">

  <title id="title">Business News Analysis — EMI Process</title>
  <desc id="description">
    A portrait workflow showing classroom materials progressing through
    separation, investigation, recombination, insights, Markdown review,
    and SVG visualization. An optional extension connects the knowledge
    workflow to product requirements, MVP development, deployment,
    and market feedback.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#62798A"></path>
    </marker>

    <marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#83927A"></path>
    </marker>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #263C4A;
      }

      .title {
        font-size: 30px;
        font-weight: 700;
      }

      .subtitle {
        font-size: 17px;
        fill: #526875;
      }

      .section {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.4px;
        fill: #526875;
      }

      .heading {
        font-size: 23px;
        font-weight: 700;
      }

      .body {
        font-size: 18px;
      }

      .small {
        font-size: 16px;
        fill: #526875;
      }

      .number {
        font-size: 19px;
        font-weight: 700;
        text-anchor: middle;
      }

      .card {
        stroke-width: 1.5;
      }

      .input {
        fill: #F1F5F8;
        stroke: #C9D6DF;
      }

      .analysis {
        fill: #EAF6FA;
        stroke: #B9DCE6;
      }

      .knowledge {
        fill: #FAEDF3;
        stroke: #E6C9D7;
      }

      .artifact {
        fill: #F0F7E9;
        stroke: #CDDFB9;
      }

      .product {
        fill: #FFF3E5;
        stroke: #E9D3B5;
      }

      .flow {
        fill: none;
        stroke: #62798A;
        stroke-width: 2;
        marker-end: url(#arrow);
      }

      .optional {
        stroke-dasharray: 6 6;
      }

      .feedback {
        fill: none;
        stroke: #83927A;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        marker-end: url(#feedbackArrow);
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="840" height="1880" fill="#FCFDFE"></rect>

  <!-- Document header -->
  <text x="420" y="52" text-anchor="middle" class="title">
    Business News Analysis
  </text>
  <text x="420" y="82" text-anchor="middle" class="subtitle">
    EMI · Session: 2026-11-25
  </text>
  <text x="420" y="111" text-anchor="middle" class="subtitle">
    Systematic · Structured · Process-oriented
  </text>

  <!-- Section 1 -->
  <text x="80" y="150" class="section">
    01 / KNOWLEDGE PROCESSING
  </text>

  <!-- Input -->
  <rect x="80" y="169" width="680" height="118" rx="16" class="card input"></rect>
  <circle cx="117" cy="202" r="18" fill="#DCE7EE"></circle>
  <text x="117" y="209" class="number">1</text>
  <text x="150" y="209" class="heading">Collect and recognize</text>
  <text x="108" y="243" class="body">
    Handwritten notes · Audio · Video · Images
  </text>
  <text x="108" y="270" class="small">
    Preserve colors, highlighted ranges, arrows, and grouping.
  </text>

  <path d="M420 287 V317" class="flow"></path>

  <!-- Separate -->
  <rect x="80" y="323" width="680" height="108" rx="16" class="card analysis"></rect>
  <circle cx="117" cy="355" r="18" fill="#CDEAF2"></circle>
  <text x="117" y="362" class="number">2</text>
  <text x="150" y="362" class="heading">Separate</text>
  <text x="108" y="395" class="body">
    Define the problem, demand, questions, and components.
  </text>
  <text x="108" y="418" class="small">
    Output: a clear scope and a set of analytical questions.
  </text>

  <path d="M420 431 V461" class="flow"></path>

  <!-- Investigate -->
  <rect x="80" y="467" width="680" height="118" rx="16" class="card analysis"></rect>
  <circle cx="117" cy="499" r="18" fill="#CDEAF2"></circle>
  <text x="117" y="506" class="number">3</text>
  <text x="150" y="506" class="heading">Investigate</text>
  <text x="108" y="540" class="body">
    Examine evidence, examples, and potential relationships.
  </text>
  <text x="108" y="567" class="small">
    Discuss ambiguities; distinguish facts from interpretations.
  </text>

  <path d="M420 585 V615" class="flow"></path>

  <!-- Recombine -->
  <rect x="80" y="621" width="680" height="108" rx="16" class="card analysis"></rect>
  <circle cx="117" cy="653" r="18" fill="#CDEAF2"></circle>
  <text x="117" y="660" class="number">4</text>
  <text x="150" y="660" class="heading">Recombine</text>
  <text x="108" y="693" class="body">
    Integrate components into a coherent representation.
  </text>
  <text x="108" y="716" class="small">
    Make categories, relationships, and process order explicit.
  </text>

  <path d="M420 729 V759" class="flow"></path>

  <!-- Insights -->
  <rect x="80" y="765" width="680" height="108" rx="16" class="card knowledge"></rect>
  <circle cx="117" cy="797" r="18" fill="#F0D8E4"></circle>
  <text x="117" y="804" class="number">5</text>
  <text x="150" y="804" class="heading">Generate insights</text>
  <text x="108" y="837" class="body">
    Explain connections, implications, and possible actions.
  </text>
  <text x="108" y="860" class="small">
    Check effectiveness: does the analysis address its purpose?
  </text>

  <path d="M420 873 V903" class="flow"></path>

  <!-- Markdown review -->
  <rect x="80" y="909" width="680" height="118" rx="16" class="card knowledge"></rect>
  <circle cx="117" cy="941" r="18" fill="#F0D8E4"></circle>
  <text x="117" y="948" class="number">6</text>
  <text x="150" y="948" class="heading">Document and review — KB.md</text>
  <text x="108" y="982" class="body">
    Consolidate the structured summary and open questions.
  </text>
  <text x="108" y="1009" class="small">
    Review → clarify → revise → approve for visualization.
  </text>

  <path d="M420 1027 V1057" class="flow"></path>

  <!-- SVG output -->
  <rect x="80" y="1063" width="680" height="108" rx="16" class="card artifact"></rect>
  <circle cx="117" cy="1095" r="18" fill="#DDECCD"></circle>
  <text x="117" y="1102" class="number">7</text>
  <text x="150" y="1102" class="heading">Visualize — SVG</text>
  <text x="108" y="1135" class="body">
    Show the process, relationships, and outputs clearly.
  </text>
  <text x="108" y="1158" class="small">
    Portrait layout · Direct wording · Light-colored styling
  </text>

  <!-- Optional transition -->
  <path d="M420 1171 V1224" class="flow optional"></path>
  <rect x="440" y="1182" width="208" height="27" rx="8" fill="#FCFDFE"></rect>
  <text x="450" y="1201" class="small">
    Optional product extension
  </text>

  <!-- Section 2 background -->
  <rect x="60" y="1232" width="720" height="552" rx="20" fill="#FFFBF5" stroke="#EFE2D0"></rect>

  <text x="80" y="1264" class="section">
    02 / PRODUCT DEVELOPMENT
  </text>

  <!-- Requirements -->
  <rect x="80" y="1283" width="680" height="118" rx="16" class="card product"></rect>
  <circle cx="117" cy="1315" r="18" fill="#F7E3C8"></circle>
  <text x="117" y="1322" class="number">8</text>
  <text x="150" y="1322" class="heading">Define product requirements</text>
  <text x="108" y="1356" class="body">
    Connect demand, supply, functions, and verification.
  </text>
  <text x="108" y="1383" class="small">
    Artifact: PRD.md · Define the BNA Agent's responsibilities.
  </text>

  <path d="M420 1401 V1431" class="flow"></path>

  <!-- MVP -->
  <rect x="80" y="1437" width="680" height="108" rx="16" class="card product"></rect>
  <circle cx="117" cy="1469" r="18" fill="#F7E3C8"></circle>
  <text x="117" y="1476" class="number">9</text>
  <text x="150" y="1476" class="heading">Build and verify an MVP</text>
  <text x="108" y="1509" class="body">
    Create a Minimum Viable Product for the defined need.
  </text>
  <text x="108" y="1532" class="small">
    Potential form: website, application, or SaaS.
  </text>

  <path d="M420 1545 V1575" class="flow"></path>

  <!-- Deployment and market -->
  <rect x="80" y="1581" width="680" height="150" rx="16" class="card product"></rect>
  <circle cx="117" cy="1613" r="18" fill="#F7E3C8"></circle>
  <text x="117" y="1620" class="number">10</text>
  <text x="150" y="1620" class="heading">Deploy and assess market value</text>
  <text x="108" y="1654" class="body">
    Publish a web application and share its deployment URL.
  </text>
  <text x="108" y="1682" class="body">
    Producers ↔ Market ↔ Consumers
  </text>
  <text x="108" y="1710" class="small">
    Assess target audience, value, willingness to pay, and transactions.
  </text>

  <!-- Market feedback loop -->
  <path d="M760 1684 H802 V1337 H766" class="feedback"></path>
  <text x="791" y="1530" transform="rotate(-90 791 1530)" text-anchor="middle" class="small">
    Market feedback → refine requirements
  </text>

  <!-- Supporting AI roles -->
  <rect x="80" y="1744" width="680" height="27" rx="8" fill="#F4F6EF"></rect>
  <text x="420" y="1763" text-anchor="middle" class="small">
    AI support: Chatbot · Task agent · Coding agent
  </text>

  <!-- Footer / legend -->
  <line x1="80" y1="1810" x2="124" y2="1810" stroke="#62798A" stroke-width="2"></line>
  <text x="137" y="1816" class="small">Process sequence</text>

  <line x1="340" y1="1810" x2="384" y2="1810" stroke="#62798A" stroke-width="2" stroke-dasharray="6 6"></line>
  <text x="397" y="1816" class="small">
    Optional extension / feedback
  </text>

  <text x="80" y="1848" class="small">
    Diagram palette is illustrative; the source-note color legend is pending.
  </text>
  <text x="80" y="1871" class="small">
    TP and supporting-file dependencies remain open for confirmation.
  </text>
</svg>
</body></html>
