                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description"
      content="Bilingual Business News Analysis and EMI knowledge-to-product workflow.">
<title>BNA × EMI</title>

<style>
  :root {
    color-scheme: light;
    --bg: #f7fafc;
    --surface: #ffffff;
    --text: #243b4a;
    --muted: #536a78;
    --border: #d5e1e8;
    --accent: #27627b;
    --blue: #eaf5fa;
    --pink: #faedf3;
    --green: #eef6e8;
    --orange: #fff2e3;
    --shadow: 0 12px 32px rgb(32 59 75 / 12%);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111b23;
    --surface: #1b2933;
    --text: #e8f0f5;
    --muted: #b7c9d4;
    --border: #405564;
    --accent: #a4d9ef;
    --blue: #203b49;
    --pink: #3c2c3a;
    --green: #293d2e;
    --orange: #423627;
    --shadow: 0 12px 32px rgb(0 0 0 / 25%);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "Noto Sans TC", sans-serif;
    line-height: 1.7;
  }

  button, a { -webkit-tap-highlight-color: transparent; }

  button {
    min-height: 44px;
    padding: .55rem .85rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font: inherit;
    cursor: pointer;
  }

  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }

  .skip {
    position: fixed;
    top: -100px;
    left: 1rem;
    z-index: 100;
    padding: .6rem 1rem;
    background: var(--surface);
    color: var(--accent);
  }
  .skip:focus { top: .5rem; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1120px;
    margin: auto;
    padding: .75rem 1rem;
    display: flex;
    align-items: center;
    gap: .7rem;
  }

  .menu-wrap { position: relative; }

  #menu-toggle {
    min-width: 44px;
    font-size: 1.2rem;
  }

  .brand {
    flex: 1;
    min-width: 0;
    font-weight: 750;
    line-height: 1.35;
  }

  .brand small {
    display: block;
    font-size: .75rem;
    color: var(--muted);
    font-weight: 400;
  }

  .controls { display: flex; gap: .45rem; }

  #module-menu {
    position: absolute;
    top: calc(100% + .75rem);
    left: 0;
    width: min(330px, calc(100vw - 2rem));
    max-height: 70vh;
    overflow-y: auto;
    padding: .6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  #module-menu button {
    display: block;
    width: 100%;
    margin: .2rem 0;
    border-color: transparent;
    text-align: left;
  }

  #module-menu button[aria-current="page"] {
    background: var(--blue);
    border-color: var(--border);
    font-weight: 700;
  }

  main {
    max-width: 940px;
    margin: auto;
    padding: 2rem 1rem 2.5rem;
  }

  .eyebrow {
    color: var(--accent);
    font-size: .8rem;
    font-weight: 750;
    letter-spacing: .08em;
  }

  h1 {
    margin: .4rem 0 .7rem;
    font-size: clamp(1.8rem, 5vw, 2.65rem);
    line-height: 1.25;
  }

  h2 {
    margin: 0 0 .4rem;
    font-size: 1.2rem;
    line-height: 1.4;
  }

  p { margin: .4rem 0; }

  .intro {
    max-width: 70ch;
    font-size: 1.06rem;
    color: var(--muted);
  }

  .principles {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin: 1.2rem 0 1.6rem;
  }

  .pill {
    padding: .25rem .75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: .85rem;
  }

  .workflow {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 1.5rem;
  }

  .workflow li { position: relative; }

  .workflow li:not(:last-child)::after {
    content: "↓";
    position: absolute;
    left: 1.7rem;
    bottom: -1.35rem;
    color: var(--muted);
    line-height: 1;
  }

  .card {
    display: flex;
    gap: 1rem;
    padding: 1.2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .blue { background: var(--blue); }
  .pink { background: var(--pink); }
  .green { background: var(--green); }
  .orange { background: var(--orange); }

  .number {
    flex: 0 0 2rem;
    width: 2rem;
    height: 2rem;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    font-weight: 750;
  }

  .card-content { min-width: 0; }
  .output { margin-top: .7rem; color: var(--muted); font-size: .9rem; }

  .notice {
    margin-top: 1.5rem;
    padding: 1rem 1.2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    color: var(--muted);
  }

  .page-nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: .75rem;
    margin-top: 2rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
  }

  #previous { justify-self: start; }
  #next { justify-self: end; }
  #position { color: var(--muted); font-size: .9rem; text-align: center; }
  #top-button { display: block; margin: 1rem auto 0; }

  footer {
    padding: 1.4rem 1rem;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
  }

  footer p { margin: .25rem 0; }

  @media (max-width: 520px) {
    .header-inner { gap: .45rem; }
    .brand { font-size: .9rem; }
    .brand small { font-size: .67rem; }
    .controls button { padding: .45rem .55rem; font-size: .85rem; }
    main { padding-top: 1.4rem; }
    .card { padding: 1rem; gap: .7rem; }
    .page-nav { gap: .4rem; }
    .page-nav button { padding: .55rem .6rem; font-size: .85rem; }
    #position { font-size: .8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  @media print {
    header, .page-nav, #top-button, .skip { display: none; }
    body { background: white; color: black; }
    main { max-width: none; }
    .card { break-inside: avoid; }
  }
</style>
</head>

<body>
<a id="skip" class="skip" href="#main">Skip to content</a>

<header>
  <div class="header-inner">
    <div id="menu-wrap" class="menu-wrap">
      <button id="menu-toggle" type="button"
              aria-label="Open module menu"
              aria-expanded="false"
              aria-controls="module-menu">☰</button>
      <nav id="module-menu" aria-label="Modules" hidden></nav>
    </div>

    <div class="brand">
      BNA × EMI
      <small id="subtitle">Knowledge → Insights → Product</small>
    </div>

    <div class="controls">
      <button id="language-button" type="button">繁中</button>
      <button id="theme-button" type="button">Dark</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <article aria-labelledby="page-title">
    <div id="eyebrow" class="eyebrow"></div>
    <h1 id="page-title" tabindex="-1"></h1>
    <p id="intro" class="intro"></p>
    <div id="principles" class="principles"></div>
    <ol id="workflow" class="workflow"></ol>
    <aside id="notice" class="notice"></aside>
  </article>

  <nav id="page-nav" class="page-nav" aria-label="Page navigation">
    <button id="previous" type="button">← Previous page</button>
    <span id="position" role="status" aria-live="polite"></span>
    <button id="next" type="button">Next page →</button>
  </nav>

  <button id="top-button" type="button">↑ Return to the top</button>
</main>

<footer>
  <p>Architect: Prof. Shihmin Lo</p>
  <p id="version"></p>
  <p id="copyright"></p>
</footer>

<script>
"use strict";

// Confirm the copyright holder before public release.
const CONFIG = {
  version: "0.1.0",
  year: 2026,
  copyrightHolder: "Prof. Shihmin Lo"
};

const bilingual = (en, zh) => ({ en, zh });
const step = (title, body, output, color = "blue") =>
  ({ title, body, output, color });

const modules = [
  {
    id: "overview",
    title: bilingual("Overview", "整體架構"),
    intro: bilingual(
      "From classroom materials to reviewed knowledge, insights, and a potential digital product.",
      "從課堂素材出發，形成經檢核的知識、洞察，以及具發展潛力的數位產品。"
    ),
    steps: [
      step(
        bilingual("Collect materials", "蒐集素材"),
        bilingual(
          "Gather handwritten notes, audio, video, and images. Preserve visual organization.",
          "蒐集手寫筆記、錄音、影片與圖片，保留原始視覺組織。"
        ),
        bilingual("Source materials and context.", "原始素材與背景脈絡。")
      ),
      step(
        bilingual("Analyze and integrate", "分析與整合"),
        bilingual(
          "Separate the subject, investigate with evidence, and recombine relationships.",
          "拆解主題、依據證據探究，再重組各部分的關係。"
        ),
        bilingual("Evidence-supported insights.", "有證據支持的洞察。")
      ),
      step(
        bilingual("Document and visualize", "記錄與視覺化"),
        bilingual(
          "Review KB.md, clarify uncertainties, and create a process diagram.",
          "檢核 KB.md、釐清不確定事項，並製作流程圖。"
        ),
        bilingual("Reviewed Markdown and SVG.", "經檢核的 Markdown 與 SVG。"),
        "pink"
      ),
      step(
        bilingual("Extend into a product — optional", "延伸為產品——選用"),
        bilingual(
          "Define requirements, build an MVP, deploy, and assess market value.",
          "定義需求、建立 MVP、部署，並評估市場價值。"
        ),
        bilingual("A potential application or service.", "具發展潛力的應用程式或服務。"),
        "orange"
      )
    ],
    note: bilingual(
      "BNA = Business News Analysis. EMI = English as a Medium of Instruction. Session: 2026-11-25. Product development is an optional extension.",
      "BNA＝商業新聞分析；EMI＝英語授課。課堂日期：2026-11-25。產品開發為選用的延伸方向。"
    )
  },
  {
    id: "analysis",
    title: bilingual("Analytical Thinking", "分析思考"),
    intro: bilingual(
      "Progress from clearly defined questions to an integrated explanation.",
      "從明確的問題出發，逐步形成整合性的解釋。"
    ),
    steps: [
      step(
        bilingual("Separate", "拆解"),
        bilingual(
          "Identify the problem, demand, questions, stakeholders, and components.",
          "辨識問題、需求、待答問題、利害關係人與組成要素。"
        ),
        bilingual("A defined scope and question set.", "明確範圍與問題集合。")
      ),
      step(
        bilingual("Investigate", "探究"),
        bilingual(
          "Examine evidence and examples. Distinguish facts from interpretations.",
          "檢視證據與例子，區分事實與詮釋。"
        ),
        bilingual("Evidence-supported findings.", "有證據支持的發現。")
      ),
      step(
        bilingual("Recombine", "重組"),
        bilingual(
          "Integrate categories, relationships, and stages into a coherent representation.",
          "將類別、關係與階段整合為一致的表徵。"
        ),
        bilingual("A structured representation or mind map.", "結構化表徵或心智圖。")
      ),
      step(
        bilingual("Generate insights", "產生洞察"),
        bilingual(
          "Explain implications, answer the original questions, and identify possible actions.",
          "說明意涵、回應原始問題，並辨識可能的行動。"
        ),
        bilingual("Insights connected to the purpose.", "與原始目的相連的洞察。"),
        "pink"
      )
    ],
    note: bilingual(
      "Effectiveness concerns reaching the goal. Efficiency concerns output relative to input. The handwritten mark beside “efficient” remains unresolved.",
      "效果關注是否達成目標；效率關注投入與產出的關係。原筆記中「efficient」旁的符號仍待釐清。"
    )
  },
  {
    id: "knowledge",
    title: bilingual("Knowledge Processing", "知識處理"),
    intro: bilingual(
      "Combine AI assistance with human review to preserve meaning, not merely transcribe text.",
      "結合 AI 協助與人工檢核，保留原意，而非僅轉錄文字。"
    ),
    steps: [
      step(
        bilingual("Recognize and organize", "辨識與整理"),
        bilingual(
          "Extract text and identify topics, colors, highlighted ranges, arrows, and groups.",
          "擷取文字，辨識主題、色彩、標示範圍、箭頭與分組。"
        ),
        bilingual("Organized source content.", "整理後的來源內容。")
      ),
      step(
        bilingual("Analyze and clarify", "分析與釐清"),
        bilingual(
          "Investigate relationships and discuss unclear handwriting or uncertain meanings.",
          "探究關係，討論難辨字跡及不確定的含義。"
        ),
        bilingual("Findings with uncertainties marked.", "已標記不確定事項的發現。")
      ),
      step(
        bilingual("Write KB.md", "撰寫 KB.md"),
        bilingual(
          "Consolidate concepts, processes, outputs, evidence, and open questions in Markdown.",
          "以 Markdown 彙整概念、流程、產出、證據與待確認問題。"
        ),
        bilingual("A structured knowledge base.", "結構化知識庫。"),
        "pink"
      ),
      step(
        bilingual("Review and approve", "檢核與確認"),
        bilingual(
          "Clarify ambiguities and revise before producing further deliverables.",
          "釐清歧義並修訂，再製作後續成果。"
        ),
        bilingual("Reviewed knowledge ready for visualization.", "可進行視覺化的已檢核知識。"),
        "green"
      )
    ],
    note: bilingual(
      "Proposed AI roles: chatbot for discussion, task agent for defined processing, and coding agent for implementation. Team and session responsibilities remain to be specified.",

    )
  },
  {
    id: "outputs",
    title: bilingual("Artifacts and Presentation", "成果與呈現"),

      "依目的選擇成果形式，不必在每次流程中製作所有類型。"
    ),
    steps: [
      step(
        bilingual("Knowledge document", "知識文件"),
        bilingual(
          "Use KB.md as the consolidated reference and retain open questions.",
          "以 KB.md 作為彙整參考，保留待確認問題。"

        bilingual("A reviewable Markdown document.", "可檢核的 Markdown 文件。"),
        "pink"
      ),
      step(
        bilingual("SVG visualization", "SVG 視覺化"),
        bilingual(
          "Show stages, relationships, optional extensions, and feedback in portrait format.",
          "以直式版面呈現階段、關係、選用延伸與回饋。"
        ),
        bilingual("A scalable process diagram.", "可縮放的流程圖。"),
        "green"
      ),
      step(
        bilingual("Responsive bilingual SPA", "雙語響應式 SPA"),
        bilingual(
          "Present modules with language switching, light/dark themes, and clear navigation.",
          "以模組呈現內容，提供語言切換、淺色／深色主題與清楚導覽。"
        ),
        bilingual("An interactive single-page application.", "互動式單頁應用程式。"),
        "green"
      ),
      step(
        bilingual("Publish", "發布"),
        bilingual(
          "Review the application, host it, and share its deployment URL.",
          "檢核應用程式後完成架設，分享部署網址。"

        bilingual("A shareable web link.", "可分享的網頁連結。"),
        "orange"
      )
    ],
    note: bilingual(

  },
  {
    id: "product",
    title: bilingual("Product Development", "產品開發"),
    intro: bilingual(
      "Translate knowledge processing into a product and refine it through market feedback.",
      "將知識處理轉化為產品，並透過市場回饋持續修正。"
    ),
    steps: [
      step(
        bilingual("Define requirements", "定義需求"),
        bilingual(
          "Connect demand, supply, functions, and verification. Specify the BNA Agent's role.",
          "連結需求、供給、功能與驗證，明確定義 BNA Agent 的角色。"

      step(

        bilingual(

        bilingual("A deployed product and URL.", "已部署產品與網址。"),

      ),
      step(
        bilingual("Assess value and iterate", "評估價值並迭代"),
        bilingual(

  },
  {
    id: "review",
    title: bilingual("Review and Open Questions", "檢核與待確認事項"),
    intro: bilingual(

    steps: [

        ),
        bilingual("A clear and usable presentation.", "清楚且易用的呈現方式。"),
        "pink"
      ),
      step(

        bilingual(

      step(

    note: bilingual(
      "This application saves language and theme preferences locally. It does not upload notes, include analytics, or use external libraries. The host's own logging policies are separate.",
      "本應用程式在本機儲存語言與主題偏好，不上傳筆記、不含分析追蹤，也不使用外部函式庫。網站主機自身的紀錄政策另計。"
    )
  }
];

const UI = {
  en: {
    subtitle: "Knowledge → Insights → Product",
    principles: ["Systematic", "Structured", "Process-oriented"],
    module: "MODULE",
    output: "Output: ",
    previous: "← Previous page",
    next: "Next page →",
    top: "↑ Return to the top",
    skip: "Skip to content",
    open: "Open module menu",
    close: "Close module menu",
    modules: "Modules",
    navigation: "Page navigation",
    language: "Switch to Traditional Chinese",
    dark: "Dark",
    light: "Light",
    darkLabel: "Switch to dark mode",
    lightLabel: "Switch to light mode",
    version: "Version",
    rights: "All rights reserved."
  },
  zh: {
    subtitle: "知識 → 洞察 → 產品",
    principles: ["系統化", "結構化", "流程導向"],
    module: "模組",
    output: "產出：",
    previous: "← 上一頁",
    next: "下一頁 →",
    top: "↑ 回到頂端",
    skip: "跳至主要內容",
    open: "開啟模組選單",
    close: "收合模組選單",
    modules: "模組",
    navigation: "頁面導覽",
    language: "Switch to English",
    dark: "深色",
    light: "淺色",
    darkLabel: "切換為深色模式",
    lightLabel: "切換為淺色模式",
    version: "版本",
    rights: "保留所有權利。"
  }
};

const $ = id => document.getElementById(id);

function readPreference(key) {
  try { return localStorage.getItem(key); }
  catch { return null; }
}

function savePreference(key, value) {
  try { localStorage.setItem(key, value); }
  catch { /* Continue with session-only preferences. */ }
}

const storedLanguage = readPreference("bna-language");
let language = ["en", "zh"].includes(storedLanguage)
  ? storedLanguage : "en";

const systemTheme = matchMedia("(prefers-color-scheme: dark)");
const storedTheme = readPreference("bna-theme");
let followsSystem = !["light", "dark"].includes(storedTheme);
let theme = followsSystem
  ? (systemTheme.matches ? "dark" : "light")
  : storedTheme;

let currentIndex = 0;
const localize = value => value[language];

function textElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = text;
  return element;
}

function setMenu(open, restoreFocus = false) {
  $("module-menu").hidden = !open;
  $("menu-toggle").setAttribute("aria-expanded", String(open));
  $("menu-toggle").setAttribute(
    "aria-label", open ? UI[language].close : UI[language].open
  );
  if (restoreFocus) $("menu-toggle").focus();
}

function renderTheme() {
  document.documentElement.dataset.theme = theme;
  const showDark = theme === "light";
  $("theme-button").textContent =
    showDark ? UI[language].dark : UI[language].light;
  $("theme-button").setAttribute(
    "aria-label",
    showDark ? UI[language].darkLabel : UI[language].lightLabel
  );
}

function renderMenu() {
  const menu = $("module-menu");
  menu.replaceChildren();
  menu.setAttribute("aria-label", UI[language].modules);

  modules.forEach((module, index) => {
    const button = textElement(
      "button", "", `${index + 1}. ${localize(module.title)}`
    );
    button.type = "button";
    if (index === currentIndex) {
      button.setAttribute("aria-current", "page");
    }
    button.addEventListener("click", () => navigate(index));
    menu.append(button);
  });
}

function render() {
  const module = modules[currentIndex];
  const ui = UI[language];

  document.documentElement.lang = language === "zh" ? "zh-Hant-TW" : "en";
  document.title = `${localize(module.title)} | BNA × EMI`;

  $("subtitle").textContent = ui.subtitle;
  $("skip").textContent = ui.skip;
  $("language-button").textContent = language === "en" ? "繁中" : "EN";
  $("language-button").setAttribute("aria-label", ui.language);

  $("eyebrow").textContent =
    `${ui.module} ${String(currentIndex + 1).padStart(2, "0")} / ` +
    String(modules.length).padStart(2, "0");

  $("page-title").textContent = localize(module.title);
  $("intro").textContent = localize(module.intro);

  $("principles").replaceChildren(
    ...ui.principles.map(text => textElement("span", "pill", text))
  );

  $("workflow").replaceChildren();

  module.steps.forEach((item, index) => {
    const li = document.createElement("li");
    const card = document.createElement("section");
    card.className = `card ${item.color}`;

    const number = textElement("span", "number", String(index + 1));
    number.setAttribute("aria-hidden", "true");

    const content = document.createElement("div");
    content.className = "card-content";
    content.append(
      textElement("h2", "", localize(item.title)),
      textElement("p", "", localize(item.body)),
      textElement("p", "output", ui.output + localize(item.output))
    );

    card.append(number, content);
    li.append(card);
    $("workflow").append(li);
  });

  $("notice").textContent = localize(module.note);
  $("previous").textContent = ui.previous;
  $("next").textContent = ui.next;
  $("previous").disabled = currentIndex === 0;
  $("next").disabled = currentIndex === modules.length - 1;
  $("position").textContent = `${currentIndex + 1} / ${modules.length}`;
  $("page-nav").setAttribute("aria-label", ui.navigation);
  $("top-button").textContent = ui.top;

  $("version").textContent = `${ui.version}: v${CONFIG.version}`;
  $("copyright").textContent =
    `© ${CONFIG.year} ${CONFIG.copyrightHolder}. ${ui.rights}`;

  renderMenu();
  renderTheme();
  setMenu(false);
}

function returnToTop() {
  $("page-title").focus({ preventScroll: true });
  window.scrollTo({
    top: 0,
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
      ? "auto" : "smooth"
  });
}

function navigate(index) {
  if (index < 0 || index >= modules.length) return;
  setMenu(false);

  const hash = `#${modules[index].id}`;
  if (location.hash !== hash) {
    location.hash = hash;
  } else {
    currentIndex = index;
    render();
    returnToTop();
  }
}

function loadRoute(moveToTop = false) {
  const route = location.hash.slice(1);
  const index = modules.findIndex(module => module.id === route);
  currentIndex = index >= 0 ? index : 0;
  render();
  if (moveToTop) returnToTop();
}

$("menu-toggle").addEventListener("click", () => {
  const opening = $("module-menu").hidden;
  setMenu(opening);
  if (opening) {
    $("module-menu").querySelector('[aria-current="page"]')?.focus();
  }
});

document.addEventListener("click", event => {
  if (!$("menu-wrap").contains(event.target)) setMenu(false);
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !$("module-menu").hidden) {
    setMenu(false, true);
  }
});

$("menu-wrap").addEventListener("focusout", event => {
  if (!$("menu-wrap").contains(event.relatedTarget)) setMenu(false);
});

$("language-button").addEventListener("click", () => {
  language = language === "en" ? "zh" : "en";
  savePreference("bna-language", language);
  render();
});

$("theme-button").addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  followsSystem = false;
  savePreference("bna-theme", theme);
  renderTheme();
});

function onSystemThemeChange(event) {
  if (followsSystem) {
    theme = event.matches ? "dark" : "light";
    renderTheme();
  }
}

if (systemTheme.addEventListener) {
  systemTheme.addEventListener("change", onSystemThemeChange);
} else {
  systemTheme.addListener(onSystemThemeChange);
}

$("previous").addEventListener("click", () => navigate(currentIndex - 1));
$("next").addEventListener("click", () => navigate(currentIndex + 1));
$("top-button").addEventListener("click", returnToTop);
window.addEventListener("hashchange", () => loadRoute(true));

loadRoute();
</script>
</body>
</html>
